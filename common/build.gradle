plugins {
    id 'agency.highlysuspect.minivan' version '0.5'
    id 'multiloader-common'
}

// --- Consumable configurations for loader subprojects ---
configurations {
    commonJava {
        canBeConsumed = true
        canBeResolved = false
    }
    commonResources {
        canBeConsumed = true
        canBeResolved = false
    }
}

artifacts {
    commonJava(sourceSets.main.java.sourceDirectories.singleFile)
    commonResources(sourceSets.main.resources.sourceDirectories.singleFile)
}

// minivan puts vanilla Minecraft (official Mojang names / mojmap) on the compile classpath.
// Replaces net.neoforged.moddev.legacyforge, whose NeoForm Runtime cannot build pre-1.17 MCP.
// common-networking's common has no access widener; the mod's common applies journeymap.accesswidener here.
minivan {
    version project.minecraft_version
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}
