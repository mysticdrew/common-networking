plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '7.0.0-beta.46'
    id 'net.darkhax.curseforgegradle' version '1.+'
    id 'com.modrinth.minotaur' version '[2,3)'
}

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    maven { url "https://repo.spongepowered.org/maven" }
    mavenCentral()
    mavenLocal()
}


version = "${project.version}-${project.minecraft_version}"
group = project.group_id

def baseName = "${project.base_name}" + "-forge"
base.archivesName = baseName
boolean localBuild = (hasProperty("buildProfile") && "local".equals(property("buildProfile")))


minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        register('client') {
            workingDir.convention layout.projectDirectory.dir('run')
        }

        register('server') {
            workingDir.convention layout.projectDirectory.dir('run')
            args '--nogui'
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0-beta.10'
    // Hack fix for now, force jopt-simple to be exactly 5.0.4 because Mojang ships that version, but some transtive dependencies request 6.0+
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
//    compileOnly project(":common")

}

