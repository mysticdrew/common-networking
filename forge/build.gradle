import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[7.0.2,8.0)'
    // Reobfuscates the jar to SRG names - required for 1.20.1 Forge (SRG runtime).
    id 'net.minecraftforge.renamer' version '1.1.0'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
    id 'com.modrinth.minotaur' version '2.+'
}

repositories {
    maven minecraft.mavenizer
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

// Configurations for the SRG-period -> modern-mojmap compile remap (see the remap block below).
configurations {
    fart          // ForgeAutoRenamingTool (fat jar) - remaps the forge userdev jar
    mcpConfig     // mcp_config zip - source of joined.tsrg (obf -> srg)
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")

    fart "net.minecraftforge:ForgeAutoRenamingTool:1.0.2:all"
    mcpConfig "de.oceanlabs.mcp:mcp_config:${mcp_config_version}@zip"
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
    // NOTE: accessTransformers intentionally omitted - common-networking ships none, and the
    // FG7 mavenizer AT/JDK bug on 1.20.1 makes enabling them unreliable. Restore here if added.

    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'debug'
        }
        register('client') {
            workingDir.convention layout.projectDirectory.dir('run/client')
        }
        register('server') {
            workingDir.convention layout.projectDirectory.dir('run/server')
            args 'nogui'
        }
        register('data') {
            workingDir.convention layout.projectDirectory.dir('run/data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// =====================================================================================================
// Forge compile remap: SRG-period -> modern-mojmap
//
// The FG7 forge userdev jar carries Mojang's *period* (pre-1.17 Great-Rename) MC class names
// (NetworkManager, PacketBuffer, net/minecraft/util/math/BlockPos), while :common is minivan-mapped to
// *modern* names (Connection, FriendlyByteBuf, net/minecraft/core/BlockPos). Member names already match
// (both official), so this is a CLASS-ONLY remap: join joined.tsrg (obf->srg) with Mojang's official
// client mappings (obf->modern) on the obf name, run ForgeAutoRenamingTool over the forge userdev jar,
// and prepend the result to compileJava's classpath so the modern names win.
// =====================================================================================================
def mojmapDir = layout.buildDirectory.dir("mojmap")
def joinedTsrgFile = mojmapDir.map { it.file("joined.tsrg") }
def clientMappingsFile = mojmapDir.map { it.file("client.txt") }
def srg2mojFile = mojmapDir.map { it.file("srg2mojmap.srg") }
def remappedForgeJar = mojmapDir.map { it.file("forge-${minecraft_version}-${forge_version}-mojmap.jar") }

def extractJoinedTsrg = tasks.register('extractJoinedTsrg', Copy) {
    from({ zipTree(configurations.mcpConfig.singleFile) }) {
        include 'config/joined.tsrg'
        eachFile { it.path = it.name } // flatten config/joined.tsrg -> joined.tsrg
    }
    includeEmptyDirs = false
    into mojmapDir
}

def downloadClientMappings = tasks.register('downloadClientMappings') {
    inputs.property('url', project.mojang_client_mappings_url)
    inputs.property('sha1', project.mojang_client_mappings_sha1)
    outputs.file clientMappingsFile
    doLast {
        def out = clientMappingsFile.get().asFile
        out.parentFile.mkdirs()
        new URL(project.mojang_client_mappings_url).withInputStream { i -> out.withOutputStream { o -> o << i } }
        def sha1 = java.security.MessageDigest.getInstance('SHA-1').digest(out.bytes).encodeHex().toString()
        if (sha1 != project.mojang_client_mappings_sha1) {
            throw new GradleException("client mappings sha1 mismatch: expected ${project.mojang_client_mappings_sha1} got ${sha1}")
        }
    }
}

def moj2periodFile = mojmapDir.map { it.file("moj2period.srg") }

def buildForgeRemapMaps = tasks.register('buildForgeRemapMaps') {
    dependsOn extractJoinedTsrg, downloadClientMappings
    inputs.file joinedTsrgFile
    inputs.file clientMappingsFile
    outputs.file srg2mojFile
    outputs.file moj2periodFile
    doLast {
        // obf -> srg (tsrg1 class lines: "<obf> <srg>"; members are tab-indented and skipped)
        def obf2srg = [:]
        joinedTsrgFile.get().asFile.eachLine { line ->
            if (line && !Character.isWhitespace(line.charAt(0) as char)) {
                def p = line.trim().split(' ')
                if (p.length == 2) obf2srg[p[0]] = p[1]
            }
        }
        // obf -> modern (proguard class lines at col 0: "modern.Name -> obf:")
        def obf2moj = [:]
        clientMappingsFile.get().asFile.eachLine { line ->
            if (line && !Character.isWhitespace(line.charAt(0) as char) && !line.startsWith('#') && line.endsWith(':') && line.contains(' -> ')) {
                def parts = line.split(' -> ')
                def modern = parts[0].trim().replace('.', '/')
                def obf = parts[1].trim()[0..-2].replace('.', '/') // drop trailing ':'
                obf2moj[obf] = modern
            }
        }
        // join on obf, emit class-only SRG "CL:" lines (skip identity).
        // srg2moj (compile): srg-period -> modern.  moj2period (reobf stage 1): modern -> srg-period.
        def fwd = []
        def rev = []
        obf2srg.each { obf, srg ->
            def moj = obf2moj[obf]
            if (moj != null && srg != moj) {
                fwd << "CL: ${srg} ${moj}".toString()
                rev << "CL: ${moj} ${srg}".toString()
            }
        }
        fwd.sort(); rev.sort()
        def fout = srg2mojFile.get().asFile
        fout.parentFile.mkdirs()
        fout.text = fwd.join('\n') + '\n'
        moj2periodFile.get().asFile.text = rev.join('\n') + '\n'
        logger.lifecycle("buildForgeRemapMaps: ${fwd.size()} class remaps (srg2moj + moj2period)")
    }
}

def remapForgeToMojmap = tasks.register('remapForgeToMojmap', JavaExec) {
    dependsOn buildForgeRemapMaps
    inputs.file srg2mojFile
    outputs.file remappedForgeJar
    classpath = configurations.fart
    mainClass = 'net.minecraftforge.fart.Main'
    doFirst {
        def forgeJar = configurations.compileClasspath.files.find {
            it.name == "forge-${minecraft_version}-${forge_version}.jar"
        }
        if (forgeJar == null) {
            throw new GradleException("forge userdev jar (forge-${minecraft_version}-${forge_version}.jar) not found on compileClasspath")
        }
        remappedForgeJar.get().asFile.parentFile.mkdirs()
        args '--input', forgeJar.absolutePath,
                '--output', remappedForgeJar.get().asFile.absolutePath,
                '--map', srg2mojFile.get().asFile.absolutePath
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn remapForgeToMojmap
    // Prepend the modern-mojmap forge jar so its class names win over the period-named userdev jar.
    classpath = files(remappedForgeJar) + classpath
}

// Javadoc compiles against the same sources, so it needs the modern-mojmap forge jar too.
tasks.named('javadoc', Javadoc) {
    dependsOn remapForgeToMojmap
    classpath = files(remappedForgeJar) + classpath
}

def periodJar = mojmapDir.map { it.file("reobf-period.jar") }

// Reobf stage 1: ART-remap the compiled (modern-mojmap) jar back to period-official CLASS names in
// place, using the class-only reverse map. Members are already period-official (identical to modern),
// so this only touches class/package names. After this the jar matches what FG7's toSrgFile expects.
def reobfToPeriod = tasks.register('reobfToPeriod', JavaExec) {
    dependsOn buildForgeRemapMaps
    classpath = configurations.fart
    mainClass = 'net.minecraftforge.fart.Main'
    doFirst {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def tmp = periodJar.get().asFile
        tmp.parentFile.mkdirs()
        args '--input', jarFile.absolutePath,
                '--output', tmp.absolutePath,
                '--map', moj2periodFile.get().asFile.absolutePath
    }
    // ART writes to a temp jar; overwrite the clean-named jar in place so the renamer stage sees period names.
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        java.nio.file.Files.move(periodJar.get().asFile.toPath(), jarFile.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

// Reobf stage 2: the renamer reobfs period-official -> srg-runtime IN PLACE via FG7's toSrgFile, so the
// single clean-named jar becomes SRG (JM ships clean reobf'd jars, never an -srg classifier). `jar` is
// finalized by both reobf stages, ordered stage1 -> stage2.
renamer.mappings.from minecraft.dependency.toSrgFile

def reobfJar = renamer.classes(tasks.named('jar', Jar)) {
    map.from minecraft.dependency.toSrgFile
    output = tasks.named('jar', Jar).flatMap { it.archiveFile }
}

// Linear finalizer chain: jar -> reobfToPeriod (modern->period) -> renameJar (period->srg).
reobfToPeriod.configure { finalizedBy reobfJar }

tasks.named('jar', Jar) {
    finalizedBy reobfToPeriod
    dependsOn 'processDocs'
}

// The reobf overwrites the jar in place, so tasks that read the jar artifact must run after it.
tasks.matching { it.name.startsWith('publish') || it.name.startsWith('generate') }.configureEach {
    mustRunAfter reobfJar
}

tasks.register('processDocs', Copy) {
    from(file("$rootDir/doc/")) {
        include '*.html'
        expand 'version': project.version,
                'date': new Date().format(project.dateFormat),
                'mcversion': project.minecraft_version,
                'loaderversion': project.forge_version,
                'loadername': 'Forge'
    }
    into "${layout.buildDirectory.get()}/doc"
}


// Automated upload to CurseForge for the win!
if (!project.hasProperty('curseForgeApiKey')) {
    ext.curseForgeApiKey = project.findProperty('curseforge_api_key') ?: 'notset'
}
if (!project.hasProperty('modrinthApiKey')) {
    ext.modrinthApiKey = project.findProperty('modrinth_api_key') ?: 'notset'
}

// jar is reobfuscated to SRG in place (finalizedBy reobfJar), so it is the clean-named distributable.
// Upload/publish must reference the jar AbstractArchiveTask (not the renamer's renameJar task, which
// minotaur/curse cannot convert to a File); it runs after reobfJar via the mustRunAfter above.
def publishJar = tasks.named('jar', Jar)

tasks.register('publishCurseForge', TaskPublishCurseForge) {
    apiToken = "${curseForgeApiKey}"
    def mainFile = upload(curseforge_project_id, publishJar)
    mainFile.displayName = "${project.base_name}-${project.name}-${version}"
    mainFile.releaseType = release_type
    mainFile.addModLoader('Forge')
    mainFile.addJavaVersion("Java ${java_version}")
    mainFile.addGameVersion("${project.minecraft_version}")
    mainFile.changelogType = 'html'
    mainFile.changelog = file("${layout.buildDirectory.get()}/doc/changelog.html")
}

tasks.modrinth.dependsOn(tasks.build)

modrinth {
    token = "${modrinthApiKey}"
    projectId = modrinth_project_id
    versionNumber = "${version}"
    versionName = "${project.base_name}-${project.name}-${version}"
    versionType = release_type
    uploadFile = publishJar
    gameVersions = ["${project.minecraft_version}"]
    loaders = ['forge']
    changelog = file("${layout.buildDirectory.get()}/doc/changelog.html").exists() ? file("${layout.buildDirectory.get()}/doc/changelog.html").text : null
}
