plugins {
    id 'java-library'
    id 'maven-publish'
}

boolean localBuild = (hasProperty("buildProfile") && "local".equals(property("buildProfile")))

base {
    archivesName = "${base_name}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${project.name}:$version")
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }

}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    dependsOn 'processDocs'
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_author,
                'Specification-Version'   : project.jar.archiveVersion,
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_author,
                'Implementation-Timestamp': getDate().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Timestamp'               : System.currentTimeMillis(),
                'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                'Built-On-Minecraft'      : minecraft_version
        ])
    }
}

tasks.register('processDocs', Copy) {
    def loader
    def loaderVersion

    if ("fabric".equalsIgnoreCase(project.name)) {
        loaderVersion = fabric_api_version
        loader = "Fabric"
    } else if ("neoforge".equalsIgnoreCase(project.name)) {
        loaderVersion = neoforge_version
        loader = "NeoForge"
    } else if ("forge".equalsIgnoreCase(project.name)) {
        loaderVersion = forge_version
        loader = "Forge"
    } else {
        loaderVersion = "1.0.0"
        loader = "Common"
    }
    // update docs
    from(file("$rootDir/doc/")) {
        include '*.html'
        expand 'version': project.version,
                'date': getDate(),
                'mcversion': project.minecraft_version,
                'loaderversion': loaderVersion,
                'loadername': loader
    }
    into "$project.buildDir/doc"
}

processResources {
    var expandProps = [
            'version'              : version,
            'group'                : group_id, //Else we target the task's group.
            'minecraft_version'    : minecraft_version,
            'fabric_api_version'   : fabric_api_version,
            'fabric_loader_version': fabric_loader_version,
            'mod_name'             : mod_name,
            'mod_author'           : mod_author,
            'mod_id'               : mod_id,
            'license'              : "MIT",
            'neoforge_version'     : neoforge_version,
            "forge_version"        : forge_version,
            'java_version'         : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }


    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'doc/changelog.html']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

def getDate() {
    def date = new Date()
    def formattedDate = date.format(project.dateFormat)
    return formattedDate
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    if (localBuild) {
        repositories {
            maven {
                url System.getenv("local_maven_url") // or `url "file://" + System.getenv("local_maven")`
            }
        }
    } else {
        repositories {
            maven {
                name = "CommonNetworking"
                url = uri("https://jm.gserv.me/repository/maven-releases/")

                credentials {
                    username = project.findProperty("deploy.user") ?: System.getenv("DEPLOY_USER")
                    password = project.findProperty("deploy.password") ?: System.getenv("DEPLOY_PASSWORD")
                }
            }
        }
    }
}
